name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Pull and deploy cPanel repo
    runs-on: ubuntu-latest

    steps:
      - name: Update cPanel Git repository
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_DOMAIN: ${{ secrets.CPANEL_DOMAIN }}
          CPANEL_PATH: ${{ secrets.CPANEL_PATH }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
        run: |
          set -euo pipefail

          response="$(
            curl --fail --silent --show-error --get \
              --header "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
              --data-urlencode "repository_root=${CPANEL_PATH}" \
              --data-urlencode "branch=main" \
              "https://${CPANEL_DOMAIN}:2083/execute/VersionControl/update"
          )"

          echo "${response}" | jq .
          test "$(echo "${response}" | jq -r '.result.status')" = "1"

      - name: Deploy cPanel Git repository
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_DOMAIN: ${{ secrets.CPANEL_DOMAIN }}
          CPANEL_PATH: ${{ secrets.CPANEL_PATH }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
        run: |
          set -euo pipefail

          response="$(
            curl --fail --silent --show-error --get \
              --header "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
              --data-urlencode "repository_root=${CPANEL_PATH}" \
              "https://${CPANEL_DOMAIN}:2083/execute/VersionControlDeployment/create"
          )"

          echo "${response}" | jq .
          test "$(echo "${response}" | jq -r '.result.status')" = "1"
