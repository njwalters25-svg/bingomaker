name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Upload site files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy/public
          cp index.html styles.css app.js robots.txt .htaccess deploy/
          cp -R public/free-square deploy/public/free-square
          cp -R public/thank-you deploy/public/thank-you

      - name: Upload to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./deploy/
          server-dir: ${{ secrets.CPANEL_FTP_SERVER_DIR }}
          log-level: minimal
